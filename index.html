<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Shaxsiy Budjetim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Asosiy CSS kodlari o'zgarmagan (qisqartirilgan) */
        :root { --primary: #0088cc; --secondary: #6c757d; --success: #28a745; --danger: #dc3545; --light: #f8f9fa; --dark: #343a40; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: #333; line-height: 1.6; min-height: 100vh; padding: 0; margin: 0; }
        .container { max-width: 100%; padding: 15px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0; background: linear-gradient(135deg, var(--primary), #0056b3); color: white; border-radius: 0 0 20px 20px; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3); }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
        .balance-card { text-align: center; background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%); color: white; }
        .balance-label { font-size: 14px; opacity: 0.9; margin-bottom: 5px; }
        .balance-amount { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .stats-cards { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { text-align: center; padding: 15px; }
        .stat-label { font-size: 13px; color: var(--secondary); margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-value.income { color: var(--success); }
        .stat-value.expense { color: var(--danger); }
        .chart-container { position: relative; height: 250px; margin-bottom: 20px; }
        .tabs { display: flex; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08); margin-bottom: 20px; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 500; transition: background 0.3s ease; }
        .tab.active { background-color: var(--primary); color: white; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--dark); }
        .form-input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; transition: border-color 0.3s ease; }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .form-select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; background-color: white; font-size: 16px; }
        .btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; transition: background 0.3s ease; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .history-section { margin-bottom: 20px; }
        .section-title { font-size: 18px; margin-bottom: 15px; color: var(--dark); }
        .filter-buttons { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { flex: 1; padding: 10px; border: 1px solid var(--primary); background: white; color: var(--primary); border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; transition: all 0.3s ease; min-width: 80px; }
        .filter-btn.active { background: var(--primary); color: white; }
        .filter-select { padding: 10px; border: 1px solid var(--primary); border-radius: 8px; background: white; color: var(--primary); font-size: 14px; cursor: pointer; flex: 1; min-width: 150px; }
        .expense-item { padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .expense-item:last-child { border-bottom: none; }
        .expense-info { flex: 1; }
        .expense-title { font-weight: 500; margin-bottom: 4px; }
        .expense-details { display: flex; align-items: center; font-size: 13px; color: var(--secondary); }
        .expense-amount { font-weight: bold; font-size: 18px; }
        .expense-income { color: var(--success); }
        .expense-outcome { color: var(--danger); }
        .expense-category { background: #f0f0f0; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-left: 8px; }
        .expense-actions { display: flex; gap: 8px; margin-left: 10px; }
        .action-btn { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .edit-btn { background: #ffc107; color: black; }
        .delete-btn { background: #dc3545; color: white; }
        .loading { text-align: center; padding: 30px; color: var(--secondary); }
        .hidden { display: none; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px 20px; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15); transform: translateX(100%); transition: transform 0.3s ease; z-index: 1000; }
        .notification.show { transform: translateX(0); }
        .notification.success { border-left: 4px solid var(--success); }
        .notification.error { border-left: 4px solid var(--danger); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .management-buttons { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: bold; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; }
        .download-section { margin-top: 20px; }
        .download-buttons { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        .download-options { display: flex; gap: 10px; margin-bottom: 10px; }
        .download-options select { flex: 1; }
        @media (max-width: 480px) {
            .container { padding: 10px; }
            .header { padding: 15px 0; }
            .header h1 { font-size: 20px; }
            .balance-amount { font-size: 28px; }
            .stats-cards { grid-template-columns: 1fr; }
            .card { padding: 15px; }
            .management-buttons { grid-template-columns: 1fr; }
            .download-buttons { grid-template-columns: 1fr; }
            .filter-buttons { flex-direction: column; }
            .filter-btn, .filter-select { min-width: 100%; }
            .download-options { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mening Shaxsiy Budjetim</h1>
            <p>@Axrorbek_o6 uchun maxsus</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-tab="main">Asosiy</div>
            <div class="tab" data-tab="history">Tarix</div>
            <div class="tab" data-tab="add">Qo'shish</div>
            <div class="tab" data-tab="manage">Boshqarish</div>
        </div>
        
        <div id="main-tab" class="tab-content active">
            <div class="balance-card card">
                <div class="balance-label">Joriy balans</div>
                <div class="balance-amount" id="current-balance">0 so'm</div>
            </div>
            
            <div class="stats-cards">
                <div class="stat-card card">
                    <div class="stat-label">Oylik chiqim</div>
                    <div class="stat-value expense" id="monthly-expense">0 so'm</div>
                </div>
            </div>
            
            <div class="card">
                <div class="section-title">
                    <span>Chiqimlar statistikasi</span>
                </div>
                <div class="chart-container">
                    <canvas id="chart"></canvas>
                </div>
            </div>
        </div>
        
        <div id="history-tab" class="tab-content">
            <div class="card">
                <div class="section-title">
                    <span>Operatsiyalar tarixi</span>
                </div>
                
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="week">Oxirgi hafta</button>
                    <button class="filter-btn" data-filter="month">Oxirgi oy</button>
                    <select id="category-filter" class="filter-select">
                        <option value="all">Barchasi</option>
                        <option value="uy">UY</option>
                        <option value="kv">Kvartira</option>
                        <option value="ov">Oziq-ovqat</option>
                        <option value="ozm">Ozm</option>
                        <option value="boshqa">Boshqa</option>
                    </select>
                </div>
                
                <div id="expenses-list" class="loading">
                    Ma'lumotlar yuklanmoqda...
                </div>
            </div>
        </div>
        
        <div id="add-tab" class="tab-content">
            <div class="card">
                <div class="section-title">
                    <span>Yangi operatsiya</span>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Summa</label>
                    <input type="number" id="amount" class="form-input" placeholder="Summani kiriting (so'm)">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Sabab</label>
                    <input type="text" id="reason" class="form-input" placeholder="Nima uchun?">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Kategoriya</label>
                    <select id="category" class="form-select">
                        <option value="uy">UY</option>
                        <option value="kv">Kvartira</option>
                        <option value="ov">Oziq-ovqat</option>
                        <option value="ozm">Ozm</option>
                        <option value="boshqa">Boshqa</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Tur</label>
                    <select id="type" class="form-select">
                        <option value="chiqim">Chiqim</option>
                        <option value="kirim">Kirim</option>
                    </select>
                </div>
                
                <button class="btn btn-primary" id="add-transaction">Qo'shish</button>
            </div>
        </div>
        
        <div id="manage-tab" class="tab-content">
            <div class="card">
                <div class="section-title">
                    <span>Budjetni boshqarish</span>
                </div>
                
                <div class="management-buttons">
                    <button class="btn btn-warning" id="reset-chart">Chartni 0 ga tushirish</button>
                    <button class="btn btn-danger" id="reset-month">Yangi oy boshlash</button>
                    <button class="btn btn-danger" id="reset-all">Barchasini tozalash</button>
                </div>
                
                <div class="download-section">
                    <div class="section-title">
                        <span>Ma'lumotlarni yuklab olish</span>
                    </div>
                    
                    <div class="download-options">
                        <select id="file-format" class="form-select">
                            <option value="csv">CSV fayl (Excel)</option>
                            <option value="txt">TXT fayl</option>
                            <option value="json">JSON fayl</option>
                        </select>
                    </div>
                    
                    <div class="download-buttons">
                        <button class="btn btn-success" id="download-btn">Yuklab olish</button>
                        <button class="btn btn-primary" id="copy-data">Nusxa olish</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tahrirlash modali -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Operatsiyani tahrirlash</div>
                <button class="close-modal">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Summa</label>
                <input type="number" id="edit-amount" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Sabab</label>
                <input type="text" id="edit-reason" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Kategoriya</label>
                <select id="edit-category" class="form-select">
                    <option value="uy">UY</option>
                    <option value="kv">Kvartira</option>
                    <option value="ov">Oziq-ovqat</option>
                    <option value="ozm">Ozm</option>
                    <option value="boshqa">Boshqa</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Tur</label>
                <select id="edit-type" class="form-select">
                    <option value="chiqim">Chiqim</option>
                    <option value="kirim">Kirim</option>
                </select>
            </div>
            <button class="btn btn-primary" id="save-edit">Saqlash</button>
        </div>
    </div>

    <div id="notification" class="notification">
        <span id="notification-message"></span>
    </div>

    <script>
        // DOM elementlari - hammasini bir joyda aniqlaymiz
        let tabs, tabContents, filterButtons, addButton, notification, notificationMessage;
        let resetChartBtn, resetMonthBtn, resetAllBtn, copyDataBtn, downloadBtn;
        let editModal, closeModalBtn, saveEditBtn;
        let categoryFilter, fileFormatSelect;

        // Ma'lumotlarni saqlash
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let balance = parseInt(localStorage.getItem('balance')) || 0;
        let currentMonth = localStorage.getItem('currentMonth') || new Date().getMonth();
        let currentYear = localStorage.getItem('currentYear') || new Date().getFullYear();
        let editingTransactionId = null;

        // Dastur ishga tushganda
        document.addEventListener('DOMContentLoaded', function() {
            // DOM elementlarini topish
            initializeDOM();
            
            // Telegram WebApp ni ishga tushirish
            if (typeof Telegram !== 'undefined') {
                let tg = window.Telegram.WebApp;
                tg.expand();
                tg.MainButton.setText("Yopish").onClick(() => tg.close()).show();
                
                // Foydalanuvchi ma'lumotlarini olish
                const user = tg.initDataUnsafe.user;
                if (user && user.id !== 1034121198) {
                    document.body.innerHTML = `
                        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; padding: 20px; text-align: center;">
                            <h2 style="color: #dc3545;">Ruxsat yo'q</h2>
                            <p>Ushbu ilova faqat @Axrorbek_o6 uchun mo'ljallangan</p>
                        </div>
                    `;
                    return;
                }
            }
            
            // Event listenerlarni qo'shish
            setupEventListeners();
            
            // Dasturiy ma'lumotlarni yuklash
            updateBalanceAndStats();
        });

        // DOM elementlarini topish
        function initializeDOM() {
            tabs = document.querySelectorAll('.tab');
            tabContents = document.querySelectorAll('.tab-content');
            filterButtons = document.querySelectorAll('.filter-btn');
            addButton = document.getElementById('add-transaction');
            notification = document.getElementById('notification');
            notificationMessage = document.getElementById('notification-message');
            
            // Boshqarish tugmalari
            resetChartBtn = document.getElementById('reset-chart');
            resetMonthBtn = document.getElementById('reset-month');
            resetAllBtn = document.getElementById('reset-all');
            copyDataBtn = document.getElementById('copy-data');
            downloadBtn = document.getElementById('download-btn');
            
            // Modal elementlari
            editModal = document.getElementById('edit-modal');
            closeModalBtn = document.querySelector('.close-modal');
            saveEditBtn = document.getElementById('save-edit');
            
            // Kategoriya filteri
            categoryFilter = document.getElementById('category-filter');
            
            // Fayl formati selector
            fileFormatSelect = document.getElementById('file-format');
        }

        // Event listenerlarni sozlash
        function setupEventListeners() {
            // Tablarni boshqarish
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(tc => tc.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(`${tabId}-tab`).classList.add('active');
                    
                    if (tabId === 'history') {
                        loadExpenses();
                    }
                });
            });
            
            // Filter tugmalarini boshqarish
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    loadExpenses();
                });
            });
            
            // Kategoriya filteri o'zgartirilganda
            categoryFilter.addEventListener('change', loadExpenses);
            
            // Yangi operatsiya qo'shish
            addButton.addEventListener('click', addTransaction);
            
            // Chartni 0 ga tushirish
            resetChartBtn.addEventListener('click', resetChart);
            
            // Yangi oy boshlash
            resetMonthBtn.addEventListener('click', resetMonth);
            
            // Barchasini tozalash
            resetAllBtn.addEventListener('click', resetAll);
            
            // Ma'lumotlarni nusxalash
            copyDataBtn.addEventListener('click', copyData);
            
            // Ma'lumotlarni yuklab olish
            downloadBtn.addEventListener('click', downloadData);
            
            // Modalni yopish
            closeModalBtn.addEventListener('click', () => {
                editModal.style.display = 'none';
            });
            
            // Modal tashqarisiga bosganda yopish
            window.addEventListener('click', (e) => {
                if (e.target === editModal) {
                    editModal.style.display = 'none';
                }
            });
            
            // Tahrirlangan operatsiyani saqlash
            saveEditBtn.addEventListener('click', saveEdit);
        }

        // Xabar ko'rsatish funksiyasi
        function showNotification(message, isSuccess = true) {
            if (!notification || !notificationMessage) return;
            
            notificationMessage.textContent = message;
            notification.className = 'notification ' + (isSuccess ? 'success' : 'error');
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Chart yaratish
        function initChart() {
            const ctx = document.getElementById('chart');
            if (!ctx) return;
            
            // Avvalgi chartni yo'q qilish
            if (window.budgetChart) {
                window.budgetChart.destroy();
            }
            
            // Faqat joriy oy uchun ma'lumotlarni filtrlash
            const currentMonthTransactions = transactions.filter(t => {
                const transactionDate = new Date(t.date);
                return transactionDate.getMonth() === parseInt(currentMonth) && 
                       transactionDate.getFullYear() === parseInt(currentYear);
            });
            
            // Kategoriyalar bo'yicha chiqimlarni hisoblash
            const categories = {
                'uy': 0,
                'kv': 0,
                'ov': 0,
                'ozm': 0,
                'boshqa': 0
            };
            
            currentMonthTransactions.filter(t => t.type === 'chiqim').forEach(transaction => {
                if (categories.hasOwnProperty(transaction.category)) {
                    categories[transaction.category] += parseInt(transaction.amount);
                }
            });
            
            // Faqat 0 dan katta bo'lgan kategoriyalarni ko'rsatish
            const labels = [];
            const data = [];
            const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'];
            
            Object.entries(categories).forEach(([key, value], index) => {
                if (value > 0) {
                    let label = '';
                    switch(key) {
                        case 'uy': label = 'UY'; break;
                        case 'kv': label = 'Kvartira'; break;
                        case 'ov': label = 'Oziq-ovqat'; break;
                        case 'ozm': label = 'Ozm'; break;
                        case 'boshqa': label = 'Boshqa'; break;
                    }
                    labels.push(label);
                    data.push(value);
                }
            });
            
            // Agar hech qanday ma'lumot bo'lmasa
            if (labels.length === 0) {
                labels.push('Ma\'lumot yo\'q');
                data.push(1);
                colors.length = 1;
            }
            
            const chartData = {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: colors.slice(0, labels.length),
                    borderWidth: 0
                }]
            };
            
            const options = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: {
                                size: 12
                            },
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.label + ': ' + context.raw.toLocaleString() + ' so\'m';
                            }
                        }
                    }
                }
            };
            
            // Yangi chart yaratish
            window.budgetChart = new Chart(ctx, {
                type: 'doughnut',
                data: chartData,
                options: options
            });
        }

        // Balans va statistikani yangilash
        function updateBalanceAndStats() {
            // Joriy balans
            const currentBalanceEl = document.getElementById('current-balance');
            if (currentBalanceEl) {
                currentBalanceEl.textContent = balance.toLocaleString() + ' so\'m';
            }
            
            // Oylik chiqimlar (faqat joriy oy uchun)
            const monthlyExpense = transactions
                .filter(t => {
                    const transactionDate = new Date(t.date);
                    return t.type === 'chiqim' && 
                           transactionDate.getMonth() === parseInt(currentMonth) && 
                           transactionDate.getFullYear() === parseInt(currentYear);
                })
                .reduce((total, t) => total + parseInt(t.amount), 0);
                
            const monthlyExpenseEl = document.getElementById('monthly-expense');
            if (monthlyExpenseEl) {
                monthlyExpenseEl.textContent = monthlyExpense.toLocaleString() + ' so\'m';
            }
            
            // Chartni yangilash
            initChart();
            
            // Ma'lumotlarni saqlash
            localStorage.setItem('transactions', JSON.stringify(transactions));
            localStorage.setItem('balance', balance);
            localStorage.setItem('currentMonth', currentMonth);
            localStorage.setItem('currentYear', currentYear);
        }

        // Chiqimlarni yuklash va ko'rsatish
        function loadExpenses() {
            const expensesList = document.getElementById('expenses-list');
            if (!expensesList) return;
            
            const activeFilterBtn = document.querySelector('.filter-btn.active');
            const filter = activeFilterBtn ? activeFilterBtn.getAttribute('data-filter') : 'week';
            const selectedCategory = categoryFilter ? categoryFilter.value : 'all';
            
            // Filtrlash
            let filteredTransactions = [...transactions].reverse(); // Eng yangisi birinchi
            
            // Faqat joriy oy uchun ma'lumotlarni filtrlash
            filteredTransactions = filteredTransactions.filter(t => {
                const transactionDate = new Date(t.date);
                return transactionDate.getMonth() === parseInt(currentMonth) && 
                       transactionDate.getFullYear() === parseInt(currentYear);
            });
            
            // Vaqt bo'yicha filtrlash
            if (filter === 'week') {
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
                filteredTransactions = filteredTransactions.filter(t => new Date(t.date) >= oneWeekAgo);
            } else if (filter === 'month') {
                // Bu holda joriy oy ma'lumotlari ko'rsatiladi
                // Hech qanday qo'shimcha filtrlash kerak emas
            }
            
            // Kategoriya bo'yicha filtrlash
            if (selectedCategory !== 'all') {
                filteredTransactions = filteredTransactions.filter(t => t.category === selectedCategory);
            }
            
            if (filteredTransactions.length === 0) {
                expensesList.innerHTML = '<div class="loading">Hech qanday operatsiya topilmadi</div>';
                return;
            }
            
            let html = '';
            filteredTransactions.forEach(transaction => {
                const amountClass = transaction.type === 'kirim' ? 'expense-income' : 'expense-outcome';
                const amountSign = transaction.type === 'kirim' ? '+' : '-';
                
                let categoryText = '';
                switch(transaction.category) {
                    case 'uy': categoryText = 'UY'; break;
                    case 'kv': categoryText = 'Kvartira'; break;
                    case 'ov': categoryText = 'Oziq-ovqat'; break;
                    case 'ozm': categoryText = 'Ozm'; break;
                    case 'boshqa': categoryText = 'Boshqa'; break;
                }
                
                html += `
                    <div class="expense-item">
                        <div class="expense-info">
                            <div class="expense-title">${transaction.reason}</div>
                            <div class="expense-details">
                                <span>${new Date(transaction.date).toLocaleDateString()}</span>
                                <span class="expense-category">${categoryText}</span>
                            </div>
                        </div>
                        <div class="expense-amount ${amountClass}">
                            ${amountSign}${parseInt(transaction.amount).toLocaleString()} so'm
                        </div>
                        <div class="expense-actions">
                            <button class="action-btn edit-btn" data-id="${transaction.id}">Tahrir</button>
                            <button class="action-btn delete-btn" data-id="${transaction.id}">O'chir</button>
                        </div>
                    </div>
                `;
            });
            
            expensesList.innerHTML = html;
            
            // Tahrirlash va o'chirish tugmalariga event listener qo'shish
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    editTransaction(id);
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    deleteTransaction(id);
                });
            });
        }

        // Operatsiyani tahrirlash
        function editTransaction(id) {
            const transaction = transactions.find(t => t.id === id);
            if (!transaction) return;
            
            // Modalni to'ldirish
            document.getElementById('edit-amount').value = transaction.amount;
            document.getElementById('edit-reason').value = transaction.reason;
            document.getElementById('edit-category').value = transaction.category;
            document.getElementById('edit-type').value = transaction.type;
            
            editingTransactionId = id;
            editModal.style.display = 'flex';
        }

        // Operatsiyani o'chirish
        function deleteTransaction(id) {
            if (!confirm('Bu operatsiyani o\'chirishni istaysizmi?')) return;
            
            const transactionIndex = transactions.findIndex(t => t.id === id);
            if (transactionIndex === -1) return;
            
            const transaction = transactions[transactionIndex];
            
            // Balansni tuzatish
            if (transaction.type === 'chiqim') {
                balance += parseInt(transaction.amount);
            } else {
                balance -= parseInt(transaction.amount);
            }
            
            // Operatsiyani o'chirish
            transactions.splice(transactionIndex, 1);
            
            // UI ni yangilash
            updateBalanceAndStats();
            loadExpenses();
            showNotification('Operatsiya muvaffaqiyatli o\'chirildi!');
        }

        // Yangi operatsiya qo'shish
        function addTransaction() {
            const amount = document.getElementById('amount').value;
            const reason = document.getElementById('reason').value;
            const category = document.getElementById('category').value;
            const type = document.getElementById('type').value;
            
            if (!amount || !reason) {
                showNotification('Iltimos, summa va sababni kiriting!', false);
                return;
            }
            
            // Yangi operatsiya yaratish
            const newTransaction = {
                id: Date.now(),
                amount: amount,
                reason: reason,
                category: category,
                type: type,
                date: new Date().toISOString()
            };
            
            // Balansni yangilash
            if (type === 'chiqim') {
                balance -= parseInt(amount);
            } else {
                balance += parseInt(amount);
            }
            
            // Operatsiyani qo'shish
            transactions.push(newTransaction);
            
            // UI ni yangilash
            updateBalanceAndStats();
            showNotification('Operatsiya muvaffaqiyatli qo\'shildi!');
            
            // Formani tozalash
            document.getElementById('amount').value = '';
            document.getElementById('reason').value = '';
        }

        // Chartni 0 ga tushirish
        function resetChart() {
            if (!confirm('Chartni 0 ga tushirishni istaysizmi? Bu faqat joriy oy ma\'lumotlarini tozalaydi.')) return;
            
            // Faqat joriy oy operatsiyalarini o'chirish
            transactions = transactions.filter(t => {
                const transactionDate = new Date(t.date);
                return !(transactionDate.getMonth() === parseInt(currentMonth) && 
                        transactionDate.getFullYear() === parseInt(currentYear));
            });
            
            // Balansni qayta hisoblash
            balance = transactions.reduce((total, t) => {
                return t.type === 'kirim' ? total + parseInt(t.amount) : total - parseInt(t.amount);
            }, 0);
            
            updateBalanceAndStats();
            showNotification('Chart muvaffaqiyatli 0 ga tushirildi!');
        }

        // Yangi oy boshlash
        function resetMonth() {
            if (!confirm('Yangi oy boshlashni istaysizmi? Joriy oy ma\'lumotlari saqlanib qoladi.')) return;
            
            // Oyni yangilash
            const now = new Date();
            currentMonth = now.getMonth();
            currentYear = now.getFullYear();
            
            updateBalanceAndStats();
            showNotification('Yangi oy muvaffaqiyatli boshlandi!');
        }

        // Barchasini tozalash
        function resetAll() {
            if (!confirm('Barcha ma\'lumotlarni tozalashni istaysizmi? Bu amalni bekor qilib bo\'lmaydi.')) return;
            
            transactions = [];
            balance = 0;
            currentMonth = new Date().getMonth();
            currentYear = new Date().getFullYear();
            
            updateBalanceAndStats();
            loadExpenses();
            showNotification('Barcha ma\'lumotlar tozalandi!');
        }

        // Ma'lumotlarni nusxalash
        function copyData() {
            if (transactions.length === 0) {
                showNotification('Nusxalash uchun ma\'lumot yo\'q!', false);
                return;
            }
            
            try {
                const textContent = generateTXT();
                
                // Nusxalash
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textContent).then(() => {
                        showNotification('✅ Ma\'lumotlar nusxalandi! Endi xabarga joylashtirishingiz mumkin');
                    }).catch(err => {
                        fallbackCopy(textContent);
                    });
                } else {
                    fallbackCopy(textContent);
                }
                
            } catch (error) {
                showNotification('Xatolik yuz berdi: ' + error.message, false);
            }
        }

        // Ma'lumotlarni yuklab olish
        function downloadData() {
            if (transactions.length === 0) {
                showNotification('Yuklab olish uchun ma\'lumot yo\'q!', false);
                return;
            }
            
            try {
                const fileFormat = fileFormatSelect.value;
                let content, filename, mimeType;
                
                switch(fileFormat) {
                    case 'csv':
                        content = generateCSV();
                        filename = `budjet_ma'lumotlari_${new Date().toISOString().slice(0, 10)}.csv`;
                        mimeType = 'text/csv;charset=utf-8;';
                        break;
                    case 'json':
                        content = generateJSON();
                        filename = `budjet_ma'lumotlari_${new Date().toISOString().slice(0, 10)}.json`;
                        mimeType = 'application/json;charset=utf-8;';
                        break;
                    case 'txt':
                    default:
                        content = generateTXT();
                        filename = `budjet_ma'lumotlari_${new Date().toISOString().slice(0, 10)}.txt`;
                        mimeType = 'text/plain;charset=utf-8;';
                }
                
                downloadFile(content, filename, mimeType);
                showNotification(`✅ Ma'lumotlar ${fileFormat.toUpperCase()} formatida yuklab olindi!`);
                
            } catch (error) {
                showNotification('Xatolik yuz berdi: ' + error.message, false);
            }
        }

        // CSV formatida ma'lumot yaratish
        function generateCSV() {
            let csv = 'Sana,Sabab,Summa,Tur,Kategoriya\n';
            
            // Operatsiyalarni sanasi bo'yicha tartiblash (eng yangisi birinchi)
            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedTransactions.forEach(transaction => {
                const date = new Date(transaction.date).toLocaleDateString('uz-UZ');
                const typeText = transaction.type === 'chiqim' ? 'Chiqim' : 'Kirim';
                const categoryText = getCategoryText(transaction.category);
                
                // CSV formatida qator yaratish (vergul bilan ajratilgan)
                csv += `"${date}","${transaction.reason}","${transaction.amount}","${typeText}","${categoryText}"\n`;
            });
            
            return csv;
        }

        // JSON formatida ma'lumot yaratish
        function generateJSON() {
            const data = {
                exportDate: new Date().toISOString(),
                balance: balance,
                currentMonth: currentMonth,
                currentYear: currentYear,
                transactions: transactions
            };
            
            return JSON.stringify(data, null, 2);
        }

        // TXT formatida ma'lumot yaratish
        function generateTXT() {
            let textContent = "📊 Mening Budjet Ma'lumotlarim\n\n";
            textContent += "=".repeat(40) + "\n\n";
            
            // Umumiy statistikalar
            textContent += "📈 Umumiy Statistikalar:\n";
            textContent += `💰 Jami balans: ${balance.toLocaleString()} so'm\n`;
            textContent += `📝 Jami operatsiyalar: ${transactions.length} ta\n\n`;
            
            // Kirim/chiqim statistikasi
            const totalIncome = transactions
                .filter(t => t.type === 'kirim')
                .reduce((sum, t) => sum + parseInt(t.amount), 0);
                
            const totalExpense = transactions
                .filter(t => t.type === 'chiqim')
                .reduce((sum, t) => sum + parseInt(t.amount), 0);
            
            textContent += `⬆️ Jami kirim: ${totalIncome.toLocaleString()} so'm\n`;
            textContent += `⬇️ Jami chiqim: ${totalExpense.toLocaleString()} so'm\n\n`;
            
            // Kategoriyalar bo'yicha chiqimlar
            textContent += "📂 Kategoriyalar bo'yicha chiqimlar:\n";
            const categories = {};
            transactions
                .filter(t => t.type === 'chiqim')
                .forEach(t => {
                    categories[t.category] = (categories[t.category] || 0) + parseInt(t.amount);
                });
            
            Object.entries(categories).forEach(([category, amount]) => {
                textContent += `  • ${getCategoryText(category)}: ${amount.toLocaleString()} so'm\n`;
            });
            textContent += "\n";
            
            // Barcha operatsiyalar
            textContent += "📋 Barcha Operatsiyalar:\n";
            textContent += "-".repeat(40) + "\n";
            
            // Operatsiyalarni sanasi bo'yicha tartiblash (eng yangisi birinchi)
            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sortedTransactions.forEach((transaction, index) => {
                const typeText = transaction.type === 'chiqim' ? '⬇️ Chiqim' : '⬆️ Kirim';
                const date = new Date(transaction.date).toLocaleDateString('uz-UZ');
                const categoryText = getCategoryText(transaction.category);
                
                textContent += `${index + 1}. ${date} - ${transaction.reason}\n`;
                textContent += `   ${typeText}: ${parseInt(transaction.amount).toLocaleString()} so'm (${categoryText})\n\n`;
            });
            
            return textContent;
        }

        // Faylni yuklab olish
        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Qo'shimcha nusxalash usuli
        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showNotification('✅ Ma\'lumotlar nusxalandi! Endi xabarga joylashtirishingiz mumkin');
            } catch (err) {
                showNotification('❌ Nusxalash muvaffaqiyatsiz. Qo\'lda nusxalab oling', false);
                // Agar nusxalash ishlamasa, matnni ko'rsatish
                showTextModal(text);
            }
            
            document.body.removeChild(textArea);
        }

        // Matnni modalda ko'rsatish (agar nusxalash ishlamasa)
        function showTextModal(text) {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                background: rgba(0,0,0,0.8); z-index: 10000; display: flex; 
                align-items: center; justify-content: center; padding: 20px;
            `;
            
            modal.innerHTML = `
                <div style="background: white; padding: 20px; border-radius: 10px; max-width: 500px; width: 100%; max-height: 80vh; overflow: auto;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="margin: 0;">Ma'lumotlaringiz</h3>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()" style="background: none; border: none; font-size: 20px; cursor: pointer;">×</button>
                    </div>
                    <pre style="white-space: pre-wrap; font-family: system-ui; background: #f5f5f5; padding: 15px; border-radius: 5px; max-height: 60vh; overflow: auto;">${text}</pre>
                    <button onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}').then(() => alert('Nusxalandi!')).catch(() => alert('Xatolik!'));" 
                            style="width: 100%; padding: 10px; background: #0088cc; color: white; border: none; border-radius: 5px; margin-top: 10px;">
                        Nusxa olish
                    </button>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Modalni yopish
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }

        // Kategoriya matnini olish
        function getCategoryText(category) {
            switch(category) {
                case 'uy': return 'UY';
                case 'kv': return 'Kvartira';
                case 'ov': return 'Oziq-ovqat';
                case 'ozm': return 'Ozm';
                case 'boshqa': return 'Boshqa';
                default: return category;
            }
        }

        // Tahrirlangan operatsiyani saqlash
        function saveEdit() {
            const amount = document.getElementById('edit-amount').value;
            const reason = document.getElementById('edit-reason').value;
            const category = document.getElementById('edit-category').value;
            const type = document.getElementById('edit-type').value;
            
            if (!amount || !reason) {
                showNotification('Iltimos, barcha maydonlarni to\'ldiring!', false);
                return;
            }
            
            const transactionIndex = transactions.findIndex(t => t.id === editingTransactionId);
            if (transactionIndex === -1) return;
            
            const oldTransaction = transactions[transactionIndex];
            
            // Avval eski operatsiyaning ta'sirini balansdan olib tashlaymiz
            if (oldTransaction.type === 'chiqim') {
                balance += parseInt(oldTransaction.amount);
            } else {
                balance -= parseInt(oldTransaction.amount);
            }
            
            // Yangi operatsiyaning ta'sirini balansga qo'shamiz
            if (type === 'chiqim') {
                balance -= parseInt(amount);
            } else {
                balance += parseInt(amount);
            }
            
            // Operatsiyani yangilash
            transactions[transactionIndex] = {
                ...oldTransaction,
                amount: amount,
                reason: reason,
                category: category,
                type: type
            };
            
            // UI ni yangilash
            updateBalanceAndStats();
            loadExpenses();
            editModal.style.display = 'none';
            showNotification('Operatsiya muvaffaqiyatli tahrirlandi!');
        }
    </script>
</body>
</html>
